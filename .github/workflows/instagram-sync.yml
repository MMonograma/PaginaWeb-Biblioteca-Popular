# Sincroniza las últimas publicaciones de Instagram con la página Noticias.
#
# Corre scripts/sync-instagram.py, que le pide las publicaciones a la API
# oficial de Instagram y, si hay publicaciones nuevas, hace un commit con las
# fotos y el JSON. Ese push dispara el deploy de Vercel.
#
# Necesita dos secrets del repositorio (Settings > Secrets and variables >
# Actions). Cómo se consigue cada uno está en DOCUMENTACION.md, sección 5.
#   INSTAGRAM_ACCESS_TOKEN  Token de Instagram. Dura 60 días y esta misma
#                           Action lo renueva sola todos los lunes.
#   GH_PAT_SECRETS          Token personal de GitHub con permiso para escribir
#                           secrets: es lo que permite guardar el token
#                           renovado. Vence una vez por año y ese sí hay que
#                           volver a crearlo a mano.
#
# Para correrlo a mano: pestaña Actions > "Sincronizar Instagram" > Run workflow.

name: Sincronizar Instagram

on:
  schedule:
    # Cada 3 horas, de 9 a 21 en Argentina: 5 veces por día.
    # Los horarios de cron en GitHub son siempre UTC, y Argentina es UTC-3
    # todo el año: 9, 12, 15, 18 y 21 hs de acá = 12, 15, 18, 21 y 0 UTC.
    - cron: "0 0,12,15,18,21 * * *"
    # Lunes 10:30 de Argentina: además de sincronizar, renueva el token.
    # Si se cambia este horario hay que cambiarlo también en el paso
    # "Renovar el token de Instagram", que lo compara letra por letra.
    - cron: "30 13 * * 1"
  workflow_dispatch:
    inputs:
      renovar_token:
        description: "Renovar también el token de Instagram"
        type: boolean
        default: false

# El GITHUB_TOKEN sólo necesita poder escribir el repositorio (para el commit).
permissions:
  contents: write

# Si una corrida manual coincide con la programada, la segunda espera a que
# termine la primera en vez de pisarse los commits.
concurrency:
  group: instagram-sync
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Traer el repositorio
        uses: actions/checkout@v4

      # El script sólo usa lo que ya trae Python: no hay nada que instalar.
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Leer Instagram
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python scripts/sync-instagram.py

      - name: Guardar cambios
        run: |
          git add --all public/noticias public/data
          if git diff --cached --quiet; then
            echo "No hay publicaciones nuevas: no se hace commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Noticias: sincronizar publicaciones de Instagram"
          git push

      # Va al final para que un problema al renovar no frene la
      # sincronización. Se renueva una vez por semana aunque el token dure
      # 60 días: así hay varios intentos de margen antes de que venza.
      - name: Renovar el token de Instagram
        if: github.event.schedule == '30 13 * * 1' || inputs.renovar_token
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT_SECRETS }}
        run: python scripts/sync-instagram.py --renovar
